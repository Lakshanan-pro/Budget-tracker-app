<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Personal Expense Tracker</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="login-box">
    <p class="eyebrow">PERSONAL FINANCE</p><h2>Welcome back</h2><p>Login to manage your expenses.</p>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="/signup">Sign up</a></p>
    </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => { e.preventDefault(); const res = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username.value,password:password.value})}); const data=await res.json(); alert(data.message); if(res.ok) location.href='/'; };
</script></body></html>
