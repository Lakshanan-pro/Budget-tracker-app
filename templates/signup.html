<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Personal Expense Tracker</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="login-box">
    <p class="eyebrow">PERSONAL FINANCE</p><h2>Create account</h2><p>Start tracking your expenses.</p>
    <form id="signupForm">
        <input type="text" id="username" placeholder="Username (3+ characters)" required>
        <input type="password" id="password" placeholder="Password (4+ characters)" required>
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="/login">Login</a></p>
    </form>
</div>
<script>
document.getElementById('signupForm').onsubmit = async (e) => { e.preventDefault(); const res = await fetch('/signup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username.value,password:password.value})}); const data=await res.json(); alert(data.message); if(res.status===201) location.href='/login'; };
</script></body></html>
